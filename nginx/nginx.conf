# DEPLOYMENT: First-time cert bootstrap
# nginx cannot start with the TLS config below if cert files don't exist yet.
# For first deploy:
#   1. Use nginx/nginx.conf.bootstrap instead of this file temporarily
#   2. Run: docker compose run --rm certbot  (obtains cert via HTTP challenge)
#   3. Switch back to this file and reload nginx
# See docker-compose.yml for full steps.
#

server {
    listen 80;
    server_name yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://app:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
